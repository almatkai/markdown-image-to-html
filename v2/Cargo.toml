[package]
name = "markdown-image-to-html-native-v2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Compiled-in Native V2 Markdown Image to HTML port for Tezbar"
repository = "https://github.com/almatkai/markdown-image-to-html"
readme = "README.md"
include = ["/src/**", "/tests/**", "/examples/**", "/scripts/**", "/licenses/**", "/assets/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/INTEGRATION.md", "/NOTICE.md", "/VALIDATION.md", "/manifest.json", "/.gitignore"]

[dependencies]
regex = "=1.12.2"
serde_json = "=1.0.145"
ryu-js = "=1.0.2"

[dev-dependencies]
log = "=0.4.28"
tempfile = "=3.23.0"
tokio = { version = "=1.48.0", features = ["rt", "macros", "sync"] }
