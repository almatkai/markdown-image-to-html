[package]
name = "tezbar-markdown-image-to-html"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Standalone Tezbar process extension for Markdown Image to HTML"
repository = "https://github.com/almatkai/markdown-image-to-html"

[workspace]
members = ["v2"]
resolver = "2"

[dependencies]
markdown-image-to-html-native-v2 = { path = "v2" }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "fs"] }
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "aaec571673ab64a85a136cf6bd054ef660c4d93c" }

[dev-dependencies]
tempfile = "=3.23.0"
